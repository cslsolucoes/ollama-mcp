## Changelog (este arquivo)

- 1.4.0 (21/10/2026): Plano `artefatos-providersorm-v3` (Onda 4) — conteúdo reconciliado com o código real do ProvidersORM 3.0.0 (report Onda 1, 21/10/2026; nomes confirmados por grep em `Databases.Interfaces.pas`). Escopo passa a units `Database.*.pas` (34) + `Databases.Interfaces.pas`/`Databases.pas` + fachada `Providers.Database.pas` (forma de consumo em pasta única; organização por módulos = estrutura interna). Hierarquia real `IField → IFields → ITable → ITables → ISchema → ISchemas → IDatabase` (removidos os contêineres inexistentes `TPrimaryKeys/TForeignKeys/TIndexes`); DDL com os nomes reais `CreateTableSQL/DropTableSQL/CreateTable/DropTable` (`GetSQLCreateTable` não existe); DML `ITable.Execute*` documentado como gerador de LITERAIS (`QuotedStr`, `EnsureSafeDML`), em vez dos métodos `GenerateInsertSQLOptimized...` da v2; `IEntityManager` real (`MapTable/Find/List/ListWhere/Save/Delete/Update` sobre `ITable`) e `ITable.EntityManager`; `IQueryBuilder` real (parametriza, `:paramN`; `WhereRaw/SelectRaw` sem bind; sem `SelectSum`); `ISynchronize` (diff-based, `Plan/Sync`, `TProviders.NewSynchronize`); `IUnitOfWork` e `IIdentityMap` com as assinaturas reais; dialetos e `ICatalogReader`; 3 atributos de mapeamento; faixas de exceção 41/70/80/90/91/92. Princípio a jusante reescrito separando facto técnico (QueryBuilder parametriza) e política D-N (dado do utilizador só por `IConnection.ExecuteQuery/ExecuteCommand(SQL,[params])`), removida a afirmação falsa de que o QueryBuilder não parametriza. Removidas as referências quebradas às rules antigas de roadmap e de documentação (inexistentes) e à skill de diretivas antiga (substituídas por `developer-delphi-programming-conditional-defines_V1.1.1`, `developer-delphi-providers-orm-usage_V2.0.0`, `developer-delphi-build-toolchain_V1.0.1`); `src/Views/` removido do texto (Views não existem em projetos headless; ferramentas do canónico `DatabaseTUI`/`DatabaseGUI` mencionadas); "gateway de dados do clone" agora via fachada do