| `governance-sdlc-lifecycle` | Ciclo de vida SDLC completo (planejamento → deploy) |\r
| `governance-release-management` | Gerenciar releases (gate, checklist, comunicação) |\r
| `governance-change-request` | Processo formal de change request |\r
| `governance-incident-response` | Resposta a incidentes (post-mortem, RCA) |\r
\r
### TEAM (3)\r
\r
| Skill | Cobre |\r
|-------|--------|\r
