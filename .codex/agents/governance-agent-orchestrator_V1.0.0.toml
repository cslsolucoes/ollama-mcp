\r
## Sequências canônicas\r
\r
### Nova feature (SDLC completo)\r
\r
```\r
1. governance-spec-prd-generator    ← documentar requisitos\r
2. governance-spec-technical-writer ← detalhar spec técnica\r
3. governance-sdlc-lifecycle        ← planejar ciclo de vida\r
4. governance-release-management    ← gate de release\r
```\r
\r
### Release formal\r
\r
```\r
1. governance-release-management    ← checklist de release\r
2. governance-change-request        ← formalizar mudança\r
3. (coordenar com version-agent-orchestrator para semver)\r
```\r
\r
### Incidente / post-mortem\r
\r
```\r
1. governance-incident-response     ← resposta imediata + RCA\r
2. governance-change-request        ← change request preventivo\r
3. (coordenar com quality-agent-orchestrator para hotfix técnico)\r
```\r
\r
### Auditoria de artefatos\r
\r
```\r
1. governance-artifact-inventory    ← inventário completo\r
2. governance-artifact-dependency-map ← mapear dependências\r
3. governance-artifact-traceability ← rastreabilidade req→código→doc\r
```\r
\r
### Onboarding de equipe\r
\r
```\r
1. governance-team-raci-matrix      ← definir responsabilidades\r
2. governance-team-onboarding       ← processo de onboarding\r
3. governance-team-ai-human-workflow ← integrar IA no fluxo da equipe\r
```\r
\r
