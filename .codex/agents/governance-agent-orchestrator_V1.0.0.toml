\r
| Template | Quando usar |\r
|----------|------------|\r
| `TEMPLATE_spec_prd.md` | PRD estruturado (requisitos, CA, riscos) |\r
| `TEMPLATE_dependency_map.md` | Mapa de dependências entre módulos |\r
| `TEMPLATE_change_request.md` | Formulário de change request formal |\r
| `TEMPLATE_incident_report.md` | Relatório de incidente / post-mortem |\r
| `TEMPLATE_rollback_plan.md` | Plano de rollback estruturado |\r
| `TEMPLATE_raci_matrix.md` | Matriz RACI da equipe |\r
