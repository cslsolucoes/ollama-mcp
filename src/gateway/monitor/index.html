<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila do servidor de IA</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--mut:#667085;--card:#fff;--line:#d9dee7;--ok:#1a7f4b;--warn:#b26a00;--bad:#b42318;--acc:#2456c7;--chart:#2456c7}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--fg:#e6e9ef;--mut:#98a2b3;--card:#1a2029;--line:#2e3744;--ok:#4cc38a;--warn:#f0a63a;--bad:#ff7a70;--acc:#7aa2ff;--chart:#7aa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
main{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1400px;margin:0 auto}
main>*{min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}
.card,section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0;overflow-wrap:anywhere}
.card .v{font-size:26px;font-weight:600}
.card .l{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
th{color:var(--mut);font-weight:600;font-size:12px}
.wrap{overflow-x:auto}
.empty{color:var(--mut);padding:6px 0}
.pill{display:inline-block;border-radius:10px;padding:0 8px;font-size:12px;border:1px solid var(--line)}
.na_fila{color:var(--mut)}.em_execucao{color:var(--acc);font-weight:600}.interrompido_reboot,.interrompido_gateway{color:var(--bad);font-weight:600}
.alta{color:var(--bad)}.baixa{color:var(--mut)}.ok{color:var(--ok)}.erro,.cancelado_admin,.removido,.rejeitado,.expirado{color:var(--bad)}.cancelado{color:var(--warn)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:2px 8px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.danger{color:var(--bad)}
input{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 6px}
.gpus{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:10px}
.gpu b{font-size:16px}
.threads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:8px;margin-top:10px}
.core{border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.core .l{margin-bottom:4px}
.tbar{display:flex;align-items:center;gap:6px;font-size:12px}
.tbar .name{width:26px;color:var(--mut)}
.tbar .track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.tbar .fill{display:block;height:100%;background:var(--chart)}
.tbar .pct{width:42px;text-align:right}
.sub{margin:12px 0 4px}
.mb8{margin-bottom:8px}
.dim{opacity:.6}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0}
.pbar span{display:block;height:100%;background:var(--chart)}
.pbar.hot span{background:var(--warn)}
.gpu b.hot{color:var(--warn)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px}
svg{width:100%;height:90px;background:transparent}
svg .grid{stroke:var(--line);stroke-width:1}
svg .line{fill:none;stroke:var(--chart);stroke-width:1.6}
svg text{fill:var(--mut);font-size:9px}
#status{font-size:12px;color:var(--mut)}
#msg{min-height:1.2em;color:var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
td .row{flex-wrap:nowrap;gap:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 10px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:6px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.tabs button:hover{color:var(--fg)}
textarea{font:inherit;width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 6px;resize:vertical}
select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 6px}
.det{border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.det[hidden]{display:none}
.det .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:2px 16px}
.det .kv div span{color:var(--mut)}
.det pre{white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;margin:4px 0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:12px/1.4 ui-monospace,Consolas,monospace}
.det .sc{max-height:260px;overflow:auto}
svg .line.s0{stroke:#2f6fed}svg .line.s1{stroke:#e0783a}svg .line.s2{stroke:#22a06b}svg .line.s3{stroke:#b64fd0}svg .line.s4{stroke:#c9a000}svg .line.s5{stroke:#17a2b8}
.lg{margin-right:10px;font-size:12px}.lg.s0{color:#2f6fed}.lg.s1{color:#e0783a}.lg.s2{color:#22a06b}.lg.s3{color:#b64fd0}.lg.s4{color:#c9a000}.lg.s5{color:#17a2b8}
/* Narrow windows: tighter paddings, stacked header; only the .wrap boxes scroll sideways. */
@media (max-width:640px){
header{flex-direction:column;align-items:flex-start;padding:8px}
h1{font-size:16px}
main{padding:8px;gap:8px}
.card,section{padding:8px}
.card .v{font-size:20px}
#auth{width:100%}
#auth input{flex:1 1 90px;min-width:0;width:auto}
}
</style>
</head>
<body>
<header>
  <div><h1>Fila do servidor de IA</h1><div id="status">conectando...</div></div>
  <div class="row" id="auth"></div>
</header>
<main>
  <div id="msg" role="status"></div>
  <div class="cards" id="cards"></div>
  <section><h2>Em execução</h2><div class="wrap"><table id="running"></table></div></section>
  <section><h2>Fila de espera</h2><div class="wrap"><table id="waiting"></table></div></section>
  <section id="donesec"><h2 id="donehead">Concluídos recentes</h2><div class="wrap"><table id="donelist"></table></div></section>
  <section><h2>Backends</h2><div class="wrap"><table id="backends"></table></div><div id="bkmeta" class="empty"></div></section>
  <section><h2>GPUs</h2><div class="gpus" id="gpus"></div><div id="gpumeta" class="empty"></div></section>
  <section><h2>CPU / RAM</h2><div class="gpus" id="cpucards"></div><div class="threads" id="cputhreads"></div><div id="cpumeta" class="empty"></div></section>
  <section><h2>Modelos</h2>
    <div class="l">Carregados (VRAM)</div><div class="wrap"><table id="mloaded"></table></div>
    <div class="l sub">Disponíveis (instalados)</div><div class="wrap"><table id="minstalled"></table></div>
    <div id="mmeta" class="empty"></div>
  </section>
  <section><h2>Última hora</h2><div class="charts" id="charts"></div></section>
  <section>
    <div class="tabs" role="tablist" aria-label="Histórico">
      <button type="button" role="tab" id="tabbtn-recent" data-tab="recent" aria-controls="tab-recent" aria-selected="true">Concluídos recentes</button>
      <button type="button" role="tab" id="tabbtn-events" data-tab="events" aria-controls="tab-events" aria-selected="false">Eventos</button>
      <button type="button" role="tab" id="tabbtn-joblog" data-tab="joblog" aria-controls="tab-joblog" aria-selected="false">Log em tempo real</button>
      <button type="button" role="tab" id="tabbtn-erros" data-tab="erros" aria-controls="tab-erros" aria-selected="false">Erros (treino)</button>
    </div>
    <div role="tabpanel" id="tab-recent" aria-labelledby="tabbtn-recent"><div class="wrap"><table id="recent"></table></div></div>
    <div role="tabpanel" id="tab-events" aria-labelledby="tabbtn-events" hidden><div class="wrap"><table id="events"></table></div></div>
    <div role="tabpanel" id="tab-joblog" aria-labelledby="tabbtn-joblog" hidden>
      <div class="row mb8" id="jlbar">
        <button type="button" id="jlexport" title="Baixa o log de jobs">Exportar log</button>
        <select id="jlfmt" aria-label="Formato"><option value="jsonl">JSONL</option><option value="csv">CSV</option></select>
        <select id="jlsince" aria-label="Período"><option value="">tudo (7 dias)</option><option value="3600000">última hora</option><option value="86400000">últimas 24 h</option></select>
        <label><input type="checkbox" id="jlcontent" disabled> incluir prompt e resposta (admin)</label>
        <span id="jlmeta" class="empty"></span>
      </div>
      <div class="det" id="jobdetail" hidden></div>
      <div class="wrap"><table id="joblog"></table></div>
    </div>
    <div role="tabpanel" id="tab-erros" aria-labelledby="tabbtn-erros" hidden>
      <div class="cards mb8" id="trcards"></div>
      <div class="pbar" id="trbar" hidden><span id="trbarfill"></span></div>
      <div id="trmeta" class="empty"></div>
      <div class="row mb8" id="trbar2" hidden>
        <select id="trcat" aria-label="Categoria"></select>
        <select id="trest" aria-label="Estado"></select>
        <select id="trpart" aria-label="Partição"></select>
        <select id="trtool" aria-label="Tool"></select>
        <input id="trestacao" placeholder="estação (máquina ou usuário)" size="22" maxlength="64" aria-label="Estação">
        <button type="button" id="trapply">Filtrar</button>
        <button type="button" id="trexptreino" title="Baixa o JSONL da parte de treino (só o que passa na regra de exportação)">Exportar treino</button>
        <button type="button" id="trexpteste" title="Baixa o JSONL da parte de teste">Exportar teste</button>
      </div>
      <div class="det" id="trdetail" hidden></div>
      <div class="wrap"><table id="trlist"></table></div>
    </div>
  </section>
  <section><h2>Auditoria (ações do administrador)</h2><div class="wrap"><table id="audit"></table></div></section>
</main>
<script>
"use strict";
// Every value that came from a client is shown with textContent, never as HTML.
var csrf = "", loggedIn = false, adminEnabled = false, lastState = null, es = null, pollTimer = null;
function $(id) { return document.getElementById(id); }
function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = String(text); if (cls) e.className = cls; return e; }
function fmtMs(ms) {
  ms = Number(ms) || 0;
  if (ms < 1000) return ms + " ms";
  var s = ms / 1000; if (s < 60) return s.toFixed(1).replace(".", ",") + " s";
  var m = Math.floor(s / 60); return m + " min " + String(Math.floor(s % 60)).padStart(2, "0") + " s";
}
// keep_alive -1 makes Ollama report an expiry centuries ahead: show it as permanent.
function fmtExpires(v) {
  if (!v) return "";
  var d = new Date(v);
  if (isNaN(d.getTime())) return "";
  return d.getFullYear() > 2100 ? "permanente" : d.toLocaleString("pt-BR");
}
function fmtTime(ms) { if (!ms) return ""; var d = new Date(ms); return d.toLocaleTimeString("pt-BR"); }
function msg(t) { $("msg").textContent = t || ""; }

// Tables are redrawn on every SSE message (about 2 per second). To keep the scroll position of the .wrap
// parent and the buttons (a click is lost when its button is swapped between mousedown and mouseup), a
// table whose shape did not change is updated in place: only the text, class and title of the cells that
// changed are touched, and a node cell (a button) with the same data-k key is kept as it is.
function cellInfo(c) {
  if (c && c.nodeType) return { node: c, k: c.dataset && c.dataset.k ? c.dataset.k : "" };
  if (c && c.text !== undefined) return { text: String(c.text), cls: c.cls || "", title: c.title || "" };
  return { text: c === null || c === undefined ? "" : String(c), cls: "", title: "" };
}
function cellFits(td, info) {
  if (info.node) return !!info.k && !!td.firstElementChild && td.firstElementChild.dataset.k === info.k;
  return !td.firstElementChild;
}
function tableFits(t, sig, infos) {
  var tb = t.tBodies[0];
  if (t._sig !== sig || !tb || tb.rows.length !== infos.length) return false;
  return infos.every(function (cells, i) {
    var tds = tb.rows[i].cells;
    return tds.length === cells.length && cells.every(function (info, j) { return cellFits(tds[j], info); });
  });
}
function table(id, heads, rows, emptyText) {
  var t = $(id), p = t.parentNode, old = p.querySelector(".empty");
  if (!rows.length) {
    t._sig = null; t.textContent = ""; t.style.display = "none";
    if (old && old.textContent === String(emptyText)) return;
    if (old) old.remove();
    p.appendChild(el("div", emptyText, "empty")); return;
  }
  if (old) old.remove();
  t.style.display = "";
  var infos = rows.map(function (cells) { return cells.map(cellInfo); });
  var sig = heads.join("\u0001");
  if (tableFits(t, sig, infos)) {
    var trs = t.tBodies[0].rows;
    infos.forEach(function (cells, i) {
      cells.forEach(function (info, j) {
        if (info.node) return; // same key: keep the node (and its listener)
        var td = trs[i].cells[j];
        if (td.textContent !== info.text) td.textContent = info.text;
        if (td.className !== info.cls) td.className = info.cls;
        if (info.title) { if (td.title !== info.title) td.title = info.title; } else if (td.hasAttribute("title")) td.removeAttribute("title");
      });
    });
    return;
  }
  var sl = p.scrollLeft; // a rebuild must not send the scroll back to the start
  t.textContent = ""; t._sig = sig;
  var thead = el("thead"), tr = el("tr");
  heads.forEach(function (h) { tr.appendChild(el("th", h)); });
  thead.appendChild(tr); t.appendChild(thead);
  var tb = el("tbody");
  infos.forEach(function (cells) {
    var r = el("tr");
    cells.forEach(function (info) {
      var td = el("td");
      if (info.node) td.appendChild(info.node); else { td.textContent = info.text; if (info.cls) td.className = info.cls; if (info.title) td.title = info.title; }
      r.appendChild(td);
    });
    tb.appendChild(r);
  });
  t.appendChild(tb);
  p.scrollLeft = sl;
}
function thinkLabel(v) { return v === "on" ? "ligado" : v === "off" ? "desligado" : v === "modelo" ? "padrão do modelo" : "-"; }
function who(it) { return { text: it.client_label || "", title: (it.client_ip || "") + " " + (it.client_label || "") }; }

function post(path, body) {
  return fetch(path, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", "X-CSRF-Token": csrf }, body: JSON.stringify(body || {}) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); });
}
function act(kind, id) {
  var path, reason = "";
  if (kind === "remove") {
    if (!confirm("Remover este pedido da fila? O cliente receberá um erro 409.")) return;
    reason = prompt("Motivo (opcional):") || "";
    path = "/monitor/api/queue/" + id + "/remove";
  } else if (kind === "cancel") {
    if (!confirm("Cancelar este pedido em execução? A conexão com o modelo será fechada.")) return;
    reason = prompt("Motivo (opcional):") || "";
    path = "/monitor/api/running/" + id + "/cancel";
  } else if (kind === "drain" || kind === "undrain") {
    if (kind === "drain" && !confirm("Drenar este backend? Ele não recebe pedidos novos; o que está rodando termina.")) return;
    reason = prompt("Motivo (opcional):") || "";
    path = "/monitor/api/backends/" + id + "/" + kind;
  } else path = "/monitor/api/queue/" + id + "/" + kind;
  post(path, { reason: reason }).then(function (r) {
    if (r.status === 200) msg(""); else msg((r.body && r.body.error) || ("Erro " + r.status));
    if (r.status === 401) { loggedIn = false; renderAuth(); }
    loadAudit(); if (lastState) safeRender(lastState);
  });
}
function btn(label, title, kind, id, cls) {
  var b = el("button", label, cls); b.title = title; b.type = "button";
  b.dataset.k = kind + ":" + id; // stable key: table() keeps this node while the key is the same
  b.addEventListener("click", function () { act(kind, id); });
  return b;
}

function backendCell(it) {
  if (!it.backend) return { text: "-", cls: "dim" };
  return { text: it.backend + (it.failover_rule ? " (" + it.failover_rule + ")" : ""), title: it.failover_rule ? "repassado pela regra " + it.failover_rule : "backend onde rodou" };
}
function renderBackends(list) {
  var cls = { ok: "ok", sobrecarregado: "cancelado", degradado: "cancelado", disjuntor_aberto: "erro", fora: "erro", drenado: "na_fila" };
  var label = { ok: "ok", sobrecarregado: "sobrecarregado", degradado: "degradado (fora da GPU)", disjuntor_aberto: "disjuntor aberto", fora: "fora", drenado: "drenado" };
  var rows = (list || []).map(function (b) {
    var ctl = "";
    if (loggedIn) {
      ctl = b.drained ? btn("Retomar", "Volta a receber pedidos novos", "undrain", b.id) : btn("Drenar", "Não recebe pedidos novos; o que está rodando termina", "drain", b.id);
    }
    var model = b.model ? b.model + (b.digest ? " · " + b.digest : "") + (b.processor ? " · " + b.processor : "") : "-";
    return [{ text: b.id + (b.primary ? " (primário)" : ""), title: b.host }, b.type, { text: label[b.state] || b.state, cls: cls[b.state] || "" },
      b.breaker === "fechado" ? "fechado" : { text: b.breaker === "aberto" ? "aberto" : "meio-aberto", cls: "erro" },
      b.used + "/" + b.slots + " (livres " + b.free + ")", b.queue, b.p50_ms ? fmtMs(b.p50_ms) : "-", { text: model, title: model },
      { text: b.last_error || "-", title: b.last_error || "", cls: b.last_error ? "" : "dim" }, ctl];
  });
  table("backends", ["Backend", "Tipo", "Estado", "Disjuntor", "Slots usados", "Fila", "p50", "Modelo · digest", "Último erro", ""], rows, "Sem backends.");
  var ov = (list || []).filter(function (b) { return b.rules; })[0];
  $("bkmeta").textContent = list && list.length > 1 ? (ov ? "Primário sobrecarregado: " + ov.rules + "." : "Primário sem sobrecarga.") + " A fila é uma só; slots e fila por backend contam só a geração." : "Um só backend (sem --backends): comportamento de sempre.";
}

// sameSig reports whether box was last drawn from the same data; otherwise it records the new data.
// The caller redraws the box when it returns false.
function sameSig(box, data) {
  var sig = JSON.stringify(data === undefined ? null : data);
  if (box._sig === sig) return true;
  box._sig = sig; return false;
}
// safeRender draws the state; a drawing error is shown in #msg (and the console) instead of being swallowed,
// and it never reaches the EventSource handlers.
var renderFailed = false;
function safeRender(s) {
  try {
    render(s);
    if (renderFailed) { renderFailed = false; msg(""); }
  } catch (x) {
    console.error(x);
    renderFailed = true;
    msg("Erro ao desenhar o painel: " + (x && x.message ? x.message : x));
  }
}
function render(s) {
  lastState = s;
  $("status").textContent = "versão " + s.version + " · boot " + (s.boot_id || "?").slice(0, 8) + " · ativo há " + fmtMs(s.uptime_s * 1000) + " · atualizado " + new Date(s.now).toLocaleTimeString("pt-BR");
  var c = s.cards, cards = $("cards");
  if (sameSig(cards, c)) { /* unchanged: keep the nodes (and their tooltips) */ } else {
  cards.textContent = "";
  [["Em execução", c.running], ["Na fila", c.waiting], ["Concluídos hoje", c.done_today], ["Erros hoje", c.errors_today],
   ["Espera p50 (15 min)", fmtMs(c.wait_p50_ms)], ["Espera p95 (15 min)", fmtMs(c.wait_p95_ms)],
   ["Tokens/s (15 min)", Number(c.tokens_per_sec || 0).toFixed(1).replace(".", ",")], ["Pedidos/min (15 min)", Number(c.per_minute || 0).toFixed(1).replace(".", ",")]]
    .forEach(function (x) { var d = el("div", null, "card"); d.appendChild(el("div", x[1], "v")); d.appendChild(el("div", x[0], "l")); cards.appendChild(d); });
  }

  var q = s.queue, slots = q.slots || {}, inuse = q.in_use || {};
  var runRows = q.running.map(function (it) {
    var cells = [it.lane, (it.id || "").slice(0, 8), who(it), it.tool, it.model, backendCell(it), thinkLabel(it.think), { text: it.priority, cls: it.priority }, fmtMs(it.running_ms), fmtMs(it.waiting_ms)];
    cells.push(loggedIn ? btn("Cancelar", "Cancelar este pedido em execução", "cancel", it.id, "danger") : "");
    return cells;
  });
  table("running", ["Faixa", "Id", "Cliente", "Tool", "Modelo", "Backend", "Raciocínio", "Prioridade", "Rodando há", "Esperou", ""], runRows,
    "Nada em execução (slots: geração " + (inuse.geracao || 0) + "/" + (slots.geracao || 0) + ", embed " + (inuse.embed || 0) + "/" + (slots.embed || 0) + ").");

  var waitRows = q.waiting.map(function (it) {
    var box = el("div", null, "row"); box.dataset.k = "wbox:" + it.id + ":" + (loggedIn ? 1 : 0);
    if (loggedIn) {
      box.appendChild(btn("▲", "Promover", "promote", it.id)); box.appendChild(btn("▼", "Despromover", "demote", it.id)); box.appendChild(btn("✕", "Remover da fila", "remove", it.id, "danger"));
    }
    return [it.position, it.lane, (it.id || "").slice(0, 8), who(it), it.tool, it.model, { text: "-", title: "o backend é escolhido quando o pedido começa", cls: "dim" }, thinkLabel(it.think), { text: it.priority, cls: it.priority }, fmtMs(it.waiting_ms), box];
  });

      return r;

  }

  var cbox = el("div"); cbox.appendChild(el("div", "Prompt e resposta", "l"));

  else if (!loggedIn) cbox.appendChild(el("div", "entre como admin para ver o conteúdo", "empty"));
  else if (cstate === "none") cbox.appendChild(el("div", "Sem conteúdo para este job (apagado pela retenção ou pelo teto).", "empty"));
  else if (c) {

    cbox.appendChild(el("pre", c.response));
