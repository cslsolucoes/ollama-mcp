[Service]
# nginx e o unico ponto publico; ollama escuta em todas as ifaces (firewall restringe a LAN).
# Fase 9.6 (owner 2026-10-29, D9-2): so loopback; todo acesso passa pelo nginx + gateway
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_ORIGINS=*"
# Mantem o modelo residente (nao reconstruir o KV a cada chamada).
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_NUM_PARALLEL=3"
# 2 residentes (2026-10-26): qwen3-ia + nomic-embed-text; evita recarga de ~18 GB a cada embed.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# multiagente (owner 2026-10-29 14:58): fila do Ollama 32 (teste 8.9 com 10 agentes, 0 erros); antes 8
Environment="OLLAMA_MAX_QUEUE=32"
# Contexto 32k (pedido do owner 2026-10-23): menos KV cache -> cabe 100% na VRAM.
Environment="OLLAMA_CONTEXT_LENGTH=65536"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q4_0"
# Usar as 4x RTX 3070 (32 GB total) e espalhar as camadas -> 100% GPU, 0% CPU.
Environment="OLLAMA_SCHED_SPREAD=1"
# 4 GPUs a 100 W (owner 2026-10-28 21:48): VRAM de 32 GB e a prioridade; mitigacao ate trocar a fonte de 850 W.
Environment="CUDA_VISIBLE_DEVICES=GPU-13ce3be3-9fa8-3729-491f-3add358bbf81,GPU-13d97d49-7bdf-79b2-7994-28c4dc0e2ac8,GPU-5f254212-4068-1e03-d590-d5759554409e,GPU-d7166024-7c32-3cb8-6e85-4e9188e933e7"
Environment="OLLAMA_VULKAN=false"
Environment="OLLAMA_LOAD_TIMEOUT=15m"
Environment="OLLAMA_NO_CLOUD=true"
Environment="OLLAMA_DEBUG=0"
