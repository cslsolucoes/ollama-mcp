# ---------------------------------------------------------------------------
# Ollama API origin
#   Public:  https://ia.cslsolucoes.com.br:8443  (Cloudflare proxied)
#   Upstream: mcpollama-gateway 127.0.0.1:11500 (fila + /monitor, Fase 9.6, 2026-10-29)
#             -> Ollama 127.0.0.1:11434 (loopback only)
# ---------------------------------------------------------------------------
# Client IP (Fase 9.6): CF-Connecting-IP is trusted ONLY when the request did not come
# from the LAN/loopback (i.e. it came from Cloudflare's edge; everything else is denied
# below). Before, any LAN client could forge CF-Connecting-IP and dodge the per-IP limits.
geo $ollama_from_lan {
    default        0;
    127.0.0.1      1;
    ::1            1;
    10.100.2.0/24  1;
}
map "$ollama_from_lan#$http_cf_connecting_ip" $ollama_client_ip {
    "~^1#"               $remote_addr;
    "~^0#$"              $remote_addr;
    "~^0#(?<cfip>.+)$"   $cfip;
    default              $remote_addr;
}
# Bearer token check (kept in a separate root-only file for rotation).
include /etc/nginx/ollama/auth.conf;
limit_req_zone  $ollama_client_ip zone=ollama_req:10m rate=600r/m;
limit_conn_zone $ollama_client_ip zone=ollama_conn:10m;
server {
    listen 8443 ssl;
    listen [::1]:8443 ssl;
    http2 on;
    server_name ia.cslsolucoes.com.br;
    ssl_certificate     /etc/nginx/ssl/ia.cslsolucoes.com.br.pem;
    ssl_certificate_key /etc/nginx/ssl/ia.cslsolucoes.com.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OLLAMA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 60s;
    keepalive_timeout 75s;
    # Only Cloudflare's edge may reach the origin (plus loopback for checks).
    include /etc/nginx/ollama/cloudflare-allow.conf;
    allow 127.0.0.1;
    allow ::1;
    # Local LAN clients may use the keyed proxy; internet access is Cloudflare-only.
    allow 10.100.2.0/24;
    deny all;
    limit_req_status 429;
    limit_conn_status 429;
    # Apply limits to every request, including failed auth attempts.
    limit_req zone=ollama_req burst=60 nodelay;
    # multiagente (owner 2026-10-28 22:40): 12 conexoes e 600r/m burst 60 por IP; antes 2 e 60r/m burst 20
    limit_conn ollama_conn 12;
    error_page 401 = @unauthorized;
    location @unauthorized {
        add_header WWW-Authenticate 'Bearer realm="ollama"' always;
        add_header Content-Type 'application/json' always;
        return 401 '{"error":"unauthorized"}';
    }
    # Model management is local-only: remote callers cannot pull, delete,
    # copy, push, create, or write blobs. (The gateway refuses them too.)
    location ~ ^/api/(pull|push|create|delete|copy|blobs)(/|$) {
        return 403;
    }
    # Queue monitor (Fase 9.6, owner D9-1): LAN only, read without login; the
    # admin actions (POST) need the gateway's own login + CSRF. Never via Cloudflare.
    location /monitor {
        allow 10.100.2.0/24;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:11500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Server-sent events must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
    location / {
        if ($ollama_authorized = 0) {
            return 401;
        }
        proxy_pass http://127.0.0.1:11500;
        proxy_http_version 1.1;
        # Ollama refuses non-local Host headers (DNS-rebinding guard); the gateway passes it on.
        proxy_set_header Host 127.0.0.1:11434;
        # The gateway trusts X-Real-IP only from loopback (this nginx).
        proxy_set_header X-Real-IP $ollama_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Token streaming must not be buffered. Request buffering stays ON (default):
        # the gateway relies on nginx to absorb slow request bodies (9.5, pendencia 5).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}
